<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帰参届</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .container { max-width: 400px; margin: auto; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; background: #34495e; color: white; border: none; font-weight: bold; margin-top: 10px; }
        #resultArea { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 5px; text-align: center; }
        th { background: #f0f0f0; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="inputPage" class="container">
    <h2>帰参届</h2>
    <label>教会名</label><input type="text" id="church">
    <label>帰参者名</label><input type="text" id="repName">
    <label>人数</label><input type="number" id="pNum">
    <label>日付（開始）</label><input type="date" id="startDate" onchange="createTable()">
    <label>日付（終了）</label><input type="date" id="endDate" onchange="createTable()">
    <div id="tableContainer"></div>
    <button class="btn" onclick="confirmData()">確認</button>
</div>

<div id="confirmPage" class="container hidden">
    <div id="resultArea"></div>
    <button class="btn" onclick="location.reload()">修正する</button>
    <button class="btn" onclick="capture()">画像作成</button>
</div>

<script>
    function createTable() {
        const start = new Date(document.getElementById('startDate').value);
        const end = new Date(document.getElementById('endDate').value);
        if (isNaN(start) || isNaN(end)) return;
        let html = '<table><tr><th>日</th><th>朝</th><th>昼</th><th>夕</th><th>泊</th></tr>';
        for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
            html += `<tr><td>${d.getMonth()+1}/${d.getDate()}</td>
                <td><input type="number" class="m"></td><td><input type="number" class="m"></td>
                <td><input type="number" class="m"></td><td><input type="number" class="m"></td></tr>`;
        }
        document.getElementById('tableContainer').innerHTML = html + '</table>';
    }
    function confirmData() {
        let res = `教会: ${document.getElementById('church').value}<br>代表: ${document.getElementById('repName').value}<br>`;
        res += document.getElementById('tableContainer').innerHTML;
        document.getElementById('resultArea').innerHTML = res;
        document.getElementById('inputPage').classList.add('hidden');
        document.getElementById('confirmPage').classList.remove('hidden');
    }
    async function capture() {
        const canvas = await html2canvas(document.getElementById('resultArea'));
        document.body.innerHTML = '<img src="'+canvas.toDataURL()+'" style="width:100%">';
    }
</script>
</body>
</html>
