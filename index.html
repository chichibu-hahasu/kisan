<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帰参届システム</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; padding: 10px; color: #222; }
        .container { max-width: 400px; margin: 20px auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #d32f2f; }
        .page-title { text-align: center; font-size: 1.8rem; margin: 10px 0; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 1rem; box-sizing: border-box; }
        .date-time-group { display: flex; gap: 5px; }
        .date-time-group input { flex: 1; }
        .btn { width: 100%; padding: 15px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 1.1rem; background: #333; color: #fff; }
        
        #authPage { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 80vh; border: none; box-shadow: none; background: transparent; }
        .auth-inner { background: #fff; padding: 25px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .hidden { display: none !important; }
        
        #captureArea { background: white; padding: 15px; width: 340px; border: 1px solid #000; margin: auto; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.75rem; table-layout: fixed; }
        th, td { border: 1px solid #000; padding: 2px; text-align: center; }
        th { background: #eee; }
        /* ズーム防止対策 */
        input[type="number"].table-input { padding: 5px 0; text-align: center; border: 1px solid #ddd; background: #fff; width: 30px; font-size: 16px; }
    </style>
</head>
<body>

<script>
    // ズーム防止＆０を表示させない修正版genTable
    function genTable(){
        const s = document.getElementById('arrD').value, e = document.getElementById('depD').value;
        if(!s||!e) return;
        let hasChild = document.getElementById('pC').value > 0;
        let html = `<table><tr><th>日</th><th>朝</th><th>昼</th><th>夕</th><th>泊(大)</th>`+(hasChild?'<th>泊(子)</th>':'')+'</tr>';
        let d = new Date(s), end = new Date(e);
        while(d<=end){
            // value属性を削除して空の状態にする
            html += `<tr><td>${d.getMonth()+1}/${d.getDate()}</td><td><input type="number" class="table-input"></td><td><input type="number" class="table-input"></td><td><input type="number" class="table-input"></td><td><input type="number" class="table-input"></td>`+(hasChild?'<td><input type="number" class="table-input"></td>':'')+'</tr>';
            d.setDate(d.getDate()+1);
        }
        document.getElementById('dateList').innerHTML = html+'</table>';
    }

    function validateAndConfirm(){
        const req = ['church','repName','tel','arrD','depD','trans'];
        for(let id of req){ if(!document.getElementById(id).value){ alert('※の付いた必須項目をすべて入力してください。'); return; } }
        
        const vals = {}; document.querySelectorAll('input, select, textarea').forEach(i => vals[i.id] = i.value);
        document.getElementById('resSum').innerHTML = `教会名: ${vals.church}<br>代表: ${vals.repName}<br>連絡: ${vals.tel}<br>人数: 大${vals.pA}・子${vals.pC}・乳${vals.pB}<br>男女: 男${vals.genderM}名 女${vals.genderF}名<br>到着: ${vals.arrD} ${vals.arrT}<br>出発: ${vals.depD} ${vals.depT}<br>交通: ${vals.trans}`;
        
        // 【重要】現在入力されている数字をすべて取得してから、確認画面用のHTMLを作る
        const currentInputs = document.querySelectorAll('#dateList input');
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = document.getElementById('dateList').innerHTML;
        const newInputs = tempDiv.querySelectorAll('input');
        
        // 取得した値を確認用テーブルの入力欄に再セットする
        newInputs.forEach((input, i) => {
            input.value = currentInputs[i].value;
            input.readOnly = true; // 確認画面では編集不可にする
            input.style.border = "none"; // 見た目をスッキリさせる
        });
        
        document.getElementById('resTable').innerHTML = tempDiv.innerHTML;
        document.getElementById('resMemo').innerHTML = `<strong>備考:</strong><br>${vals.memo}<br><strong>直属食券:</strong> ${vals.tDate} ${vals.tCount}枚`;
        document.getElementById('inputPage').classList.add('hidden');
        document.getElementById('confirmPage').classList.remove('hidden');
    }
    // ...以下略
</script>
</body>
</html>
