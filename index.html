<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>帰参届</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 10px; }
        .container { max-width: 400px; margin: auto; }
        input, select, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; box-sizing: border-box; }
        .btn { width: 100%; padding: 15px; margin-top: 10px; border: none; background: #333; color: white; font-weight: bold; }
        #captureArea { width: 360px; background: white; padding: 20px; border: 1px solid #000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #000; padding: 5px; text-align: center; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="inputPage" class="container">
    <h2>帰参届入力</h2>
    <label>教会名</label><input type="text" id="church">
    <label>帰参者名(代表)</label><input type="text" id="repName">
    <label>連絡先</label><input type="tel" id="tel">
    <label>人数 (大/子/乳)</label>
    <div style="display:flex; gap:5px;">
        <input type="number" id="pA" placeholder="大"><input type="number" id="pC" placeholder="子" oninput="genTable()">
        <input type="number" id="pB" placeholder="乳">
    </div>
    <label>詰所到着日時</label><input type="date" id="arrD"><input type="time" id="arrT">
    <label>詰所出発日時</label><input type="date" id="depD"><input type="time" id="depT">
    <label>交通手段</label>
    <select id="trans" onchange="toggleT()">
        <option value="">選択して下さい</option><option value="バス">バス</option>
        <option value="自教会">自教会</option><option value="同乗">同乗</option><option value="他">他</option>
    </select>
    <div id="subT" class="hidden"></div>
    <div id="dateList"></div>
    <label>備考</label><textarea id="memo" rows="3">※女性部屋希望、別席・願書等ある方もこちらにご記入下さい。</textarea>
    <button class="btn" onclick="showConfirm()">確認ページへ</button>
</div>

<div id="confirmPage" class="container hidden">
    <h2>確認ページ</h2>
    <div id="captureArea">
        <h2 style="text-align:center;">帰参届</h2>
        <div id="resSum" style="font-size:1.2rem;"></div>
        <h3 style="border-bottom:2px solid #000;">食事・宿泊明細</h3>
        <div id="resTable"></div>
        <div id="resMemo" style="margin-top:10px;"></div>
    </div>
    <button class="btn" style="background:#888;" onclick="backEdit()">修正</button>
    <button class="btn" onclick="snap()">画像作成</button>
</div>

<script>
    function toggleT(){
        const v = document.getElementById('trans').value;
        const sub = document.getElementById('subT');
        sub.innerHTML = ""; sub.classList.remove('hidden');
        if(v==='バス') sub.innerHTML='<select><option>昼行</option><option>夜行</option></select>';
        else if(v==='自教会') sub.innerHTML='<select><option>自家用車</option><option>マイクロバス</option><option>観光バス</option></select><input type="number" placeholder="台数">';
        else if(v==='同乗') sub.innerHTML='<select><option>大教会号</option><option>他教会</option></select>';
        else if(v==='他') sub.innerHTML='<input type="text" placeholder="入力して下さい">';
        else sub.classList.add('hidden');
    }
    function genTable(){
        const start = document.getElementById('arrD').value, end = document.getElementById('depD').value;
        if(!start || !end) return;
        let html = '<table><tr><th>日付</th><th>朝</th><th>昼</th><th>夕</th><th>泊</th>' + (document.getElementById('pC').value>0?'<th>泊(子)</th>':'') + '</tr>';
        let d = new Date(start), e = new Date(end);
        while(d <= e){
            html += `<tr><td>${d.getMonth()+1}/${d.getDate()}</td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td><td><input type="number"></td>` + (document.getElementById('pC').value>0?'<td><input type="number"></td>':'') + '</tr>';
            d.setDate(d.getDate()+1);
        }
        document.getElementById('dateList').innerHTML = html + '</table>';
    }
    function showConfirm(){
        document.getElementById('resSum').innerHTML = `教会名: ${document.getElementById('church').value}<br>代表: ${document.getElementById('repName').value}<br>交通: ${document.getElementById('trans').value}`;
        document.getElementById('resTable').innerHTML = document.getElementById('dateList').innerHTML;
        document.getElementById('resMemo').innerHTML = document.getElementById('memo').value;
        document.getElementById('inputPage').classList.add('hidden');
        document.getElementById('confirmPage').classList.remove('hidden');
    }
    function backEdit(){
        document.getElementById('inputPage').classList.remove('hidden');
        document.getElementById('confirmPage').classList.add('hidden');
    }
    async function snap(){
        const canvas = await html2canvas(document.getElementById('captureArea'));
        document.body.innerHTML = `<img src="${canvas.toDataURL()}" style="width:100%"><button class="btn" onclick="location.reload()">終了</button>`;
    }
</script>
</body>
</html>
